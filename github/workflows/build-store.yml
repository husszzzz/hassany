name: Hassany Store - Pro Build & Sign

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  APP_NAME: "Hassany Store"
  BUNDLE_ID: "com.hassany.store.app"

jobs:
  build-and-sign:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - name: 🚀 فحص موارد السيرفر (Capacity Check)
        run: |
          echo "=== مساحة البناء ==="
          df -h
          echo "=== المعالجات المتاحة ==="
          sysctl -n hw.ncpu

      - name: 📥 جلب ملفات المستودع
        uses: actions/checkout@v4

      - name: 🛠️ إعداد بيئة Xcode و Swift
        run: |
          sudo xcode-select --switch /Applications/Xcode_15.2.app/Contents/Developer
          xcode-select -p
          swift --version

      - name: ⚙️ تثبيت أدوات التوقيع والضغط
        run: |
          export HOMEBREW_NO_REQUIRE_TAP_TRUST=1
          brew install ldid zip
          command -v ldid || { echo "ldid غير مثبت"; exit 1; }

      - name: 📂 إنشاء هيكلية مجلدات المشروع
        run: |
          mkdir -p HassanyStore/Resources
          mkdir -p HassanyStore/Sources
          mkdir -p build-output/Payload

      # =========================================================
      # 1. ملف تعريف التطبيق لنظام iOS (Info.plist)
      # =========================================================
      - name: 📝 توليد ملف Info.plist
        run: |
          cat > HassanyStore/Resources/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleName</key> <string>${{ env.APP_NAME }}</string>
              <key>CFBundleDisplayName</key> <string>${{ env.APP_NAME }}</string>
              <key>CFBundleIdentifier</key> <string>${{ env.BUNDLE_ID }}</string>
              <key>CFBundleVersion</key> <string>1</string>
              <key>CFBundleShortVersionString</key> <string>1.0</string>
              <key>CFBundleExecutable</key> <string>HassanyStoreApp</string>
              <key>CFBundlePackageType</key> <string>APPL</string>
              <key>LSRequiresIPhoneOS</key> <true/>
              <key>MinimumOSVersion</key> <string>15.0</string>
              <key>UIBackgroundModes</key>
              <array>
                  <string>fetch</string>
                  <string>remote-notification</string>
              </array>
              <key>UIDeviceFamily</key>
              <array><integer>1</integer><integer>2</integer></array>
              <key>UILaunchScreen</key> <dict/>
              <key>UISupportedInterfaceOrientations</key>
              <array><string>UIInterfaceOrientationPortrait</string></array>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
              <key>UIUserInterfaceStyle</key> <string>Dark</string>
              <key>NSCameraUsageDescription</key> 
              <string>نحتاج الكاميرا لمسح كود التفعيل الخاص بالمتجر.</string>
          </dict>
          </plist>
          EOF

      # =========================================================
      # 2. ثوابت المتجر والألوان (Constants.swift)
      # =========================================================
      - name: 🎨 توليد ملف الثيم والألوان (Constants.swift)
        run: |
          cat > HassanyStore/Sources/Constants.swift << 'EOF'
          import SwiftUI

          struct AppTheme {
              // ألوان تناسب ستايل Hassany Store الاحترافي
              static let bgDark = Color(red: 0.04, green: 0.04, blue: 0.06)
              static let cardDark = Color(red: 0.08, green: 0.08, blue: 0.12)
              static let accentPrimary = Color(red: 0.0, green: 0.47, blue: 1.0) // أزرق احترافي
              static let accentSecondary = Color(red: 0.88, green: 0.1, blue: 0.4) // وردي نيون
              static let textMain = Color.white
              static let textSub = Color.white.opacity(0.6)
              
              // ستايل الزجاج (Glassmorphism)
              static let glassBackground = Color.white.opacity(0.05)
              static let glassStroke = Color.white.opacity(0.1)
          }

          struct Constants {
              static let storeName = "Hassany Store"
              static let version = "1.0 Pro"
              
              // سيتم ربطها بلوحة تحكم Supabase لاحقاً
              static let supabaseURL = "SUPABASE_URL_HERE"
              static let supabaseAnonKey = "SUPABASE_KEY_HERE"
          }

          // إضافة لتسهيل تصميم الزجاج في واجهات التطبيق
          struct GlassModifier: ViewModifier {
              var radius: CGFloat = 20
              func body(content: Content) -> some View {
                  content
                      .background(AppTheme.glassBackground)
                      .cornerRadius(radius)
                      .overlay(
                          RoundedRectangle(cornerRadius: radius)
                              .stroke(AppTheme.glassStroke, lineWidth: 1)
                      )
                      .shadow(color: Color.black.opacity(0.3), radius: 10, x: 0, y: 5)
              }
          }

          extension View {
              func glassCard(radius: CGFloat = 20) -> some View {
                  self.modifier(GlassModifier(radius: radius))
              }
          }
          EOF

      # =========================================================
      # 3. النماذج والبيانات (Models.swift)
      # =========================================================
      - name: 📊 توليد ملف هيكل البيانات (Models.swift)
        run: |
          cat > HassanyStore/Sources/Models.swift << 'EOF'
          import Foundation

          // نموذج التطبيق المرفوع على المتجر
          struct StoreApp: Codable, Identifiable {
              let id: String
              let name: String
              let bundleId: String
              let version: String
              let size: String
              let iconUrl: String
              let downloadUrl: String
              let category: String
              let description: String
          }

          // نموذج كود التفعيل (الاشتراك) الخاص بالزبون
          struct ActivationCode: Codable {
              let code: String
              let deviceUdid: String
              let isActive: Bool
              let expiresAt: Date
          }
          EOF
