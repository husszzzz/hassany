              <key>UILaunchScreen</key>
              <dict/>
              <key>UIRequiresFullScreen</key>          <true/>
              <key>UIStatusBarHidden</key>             <false/>
              <key>UIViewControllerBasedStatusBarAppearance</key><false/>
              <key>UIApplicationSceneManifest</key>
              <dict>
                  <key>UIApplicationSupportsMultipleScenes</key><false/>
              </dict>
              <key>UIApplicationSupportsIndirectInputEvents</key><true/>
              <key>CFBundleURLTypes</key>
              <array>
                  <dict>
                      <key>CFBundleURLName</key>
                      <string>com.hassany.store.pro</string>
                      <key>CFBundleURLSchemes</key>
                      <array>
                          <string>hassany</string>
                      </array>
                  </dict>
              </array>
              <!-- Light mode only (dark mode disabled) -->
              <key>UIUserInterfaceStyle</key>
              <string>Dark</string>
              <key>NSAppTransportSecurity</key>
              <dict>
                  <key>NSAllowsArbitraryLoads</key>
                  <true/>
              </dict>
              <key>NSCameraUsageDescription</key>
              <string>يستخدم Hassany Store الكاميرا لمسح رموز التفعيل.</string>
              <key>NSPhotoLibraryUsageDescription</key>
              <string>يستخدم Hassany Store مكتبة الصور لحفظ الصور.</string>
              <key>NSPhotoLibraryAddUsageDescription</key>
              <string>يحفظ Hassany Store لقطات الشاشة لتتمكن من مشاركتها.</string>
          </dict>
          </plist>
          PEOF

      # =============== الخطوة 4: الترجمة واللغات (Localization.swift) ===============
      - name: Generate code - Localization.swift
        run: |
          cat > Localization.swift << 'LANGEOF'
          import SwiftUI
          import Foundation
          import Combine

          /// مفتاح اللغة المحفوظ على الجهاز.
          public let kAppLanguageKey = "app_language_v1"

          public final class LanguageManager: ObservableObject {
