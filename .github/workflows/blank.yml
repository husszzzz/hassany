        run: |
          cat > Resources/Info.plist << 'PEOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleDevelopmentRegion</key>     <string>ar</string>
              <key>CFBundleAllowMixedLocalizations</key> <true/>
              <key>CFBundleLocalizations</key>
              <array><string>ar</string><string>en</string></array>
              <key>CFBundleExecutable</key>            <string>HassanyStoreApp</string>
              <key>CFBundleIdentifier</key>            <string>${{ env.NEW_BUNDLE_ID }}</string>
              <key>CFBundleInfoDictionaryVersion</key> <string>6.0</string>
              <key>CFBundleName</key>                  <string>Hassany</string>
              <key>CFBundleDisplayName</key>            <string>${{ env.NEW_APP_NAME }}</string>
              <key>CFBundlePackageType</key>            <string>APPL</string>
              <key>CFBundleSignature</key>              <string>????</string>
              <key>CFBundleShortVersionString</key>     <string>2.0</string>
              <key>CFBundleVersion</key>                <string>1</string>
              <key>CFBundleSupportedPlatforms</key>
              <array><string>iPhoneOS</string></array>
              <key>LSRequiresIPhoneOS</key>             <true/>
              <key>UIFileSharingEnabled</key>            <true/>
              <key>LSSupportsOpeningDocumentsInPlace</key> <true/>
              <key>UIBackgroundModes</key>
              <array>
                  <string>remote-notification</string>
                  <string>fetch</string>
                  <string>processing</string>
              </array>
              <key>BGTaskSchedulerPermittedIdentifiers</key>
              <array>
                  <string>com.hassany.store.refresh</string>
              </array>
              <key>NSUserNotificationsUsageDescription</key>
              <string>نُبلغك برموز التحقق وحالة التنزيل والتوقيع.</string>
              <key>LSApplicationQueriesSchemes</key>
              <array>
                  <string>itms-services</string>
                  <string>itms-apps</string>
              </array>
