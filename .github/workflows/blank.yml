      # =============== الخطوة 14: تتبع حالة الشبكة (StatusScreens.swift) ===============
      - name: Generate StatusScreens.swift
        run: |
          cat > StatusScreens.swift << 'STATUSEOF'
          import SwiftUI
          import Network

          @MainActor
          final class StatusCenter: ObservableObject {
              static let shared = StatusCenter()
              @Published var isOnline: Bool = true
              private let monitor = NWPathMonitor()
              private let queue = DispatchQueue(label: "NetworkMonitor")

              private init() {
                  monitor.pathUpdateHandler = { path in
                      DispatchQueue.main.async { self.isOnline = path.status == .satisfied }
                  }
                  monitor.start(queue: queue)
              }
          }
          STATUSEOF

      # =============== الخطوة 15: نقطة البداية وتشغيل التطبيق ===============
      - name: Generate App Entry Point
        run: |
          cat > ContentView.swift << 'MAINEOF'
          import SwiftUI

          struct ContentView: View {
              @ObservedObject var authManager: AuthManager
              var body: some View {
                  StoreRootView()
              }
          }
          MAINEOF

          cat > HassanyStoreApp.swift << 'APPEOF'
          import SwiftUI

          @main
          struct HassanyStoreApp: App {
              init() {
                  let nav = UINavigationBarAppearance()
                  nav.configureWithOpaqueBackground()
                  nav.backgroundColor = UIColor(Color.storeBg)
                  UINavigationBar.appearance().standardAppearance = nav
                  
                  let tab = UITabBarAppearance()
                  tab.configureWithOpaqueBackground()
                  tab.backgroundColor = UIColor(Color.storeCard)
                  UITabBar.appearance().standardAppearance = tab
              }

              var body: some Scene {
                  WindowGroup {
                      // بوابـة التفعيل: إذا الكود مفعل يدخل للمتجر، إذا لا يطلب الـ UDID والكود
                      ActivationGateContainer {
                          ContentView(authManager: AuthManager.shared)
                      }
                      .environment(\.layoutDirection, .rightToLeft) // فرض اللغة العربية (RTL)
                      .preferredColorScheme(.dark) // فرض الوضع الليلي الملكي
                  }
              }
          }
          APPEOF

      # =============== الخطوة 16: تجميع الكود (Compile with swiftc) ===============
      - name: Compile Application (Build)
        run: |
          echo "=== جاري تجميع تطبيق Hassany Store ==="
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          
          xcrun swiftc \
            Constants.swift \
            Models.swift \
            ImageCache.swift \
            Repositories.swift \
            FavoritesStore.swift \
            AuthManager.swift \
            ActivationManager.swift \
            AuthViews.swift \
            HapticManager.swift \
            StoreView.swift \
            StatusScreens.swift \
            ContentView.swift \
            HassanyStoreApp.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -O -module-name HassanyStore \
            -framework SwiftUI -framework UIKit -framework Foundation -framework WebKit -framework Network \
            -o build-output/HassanyStoreApp
            
          echo "✅ تم تجميع الكود بنجاح!"

      # =============== الخطوة 17: بناء ملف الـ IPA ===============
      - name: Package into IPA
        run: |
          echo "=== تحزيم التطبيق وصناعة الـ IPA ==="
          mkdir -p build-output/Payload/HassanyStore.app
          cp build-output/HassanyStoreApp build-output/Payload/HassanyStore.app/
          cp Resources/Info.plist build-output/Payload/HassanyStore.app/
          
          cd build-output
          # ضغط المجلد إلى صيغة ipa
          zip -r -q HassanyStore_VIP.ipa Payload
          echo "✅ تم تجهيز HassanyStore_VIP.ipa للاستخدام"

      # =============== الخطوة 18: رفع الـ IPA للتحميل (Artifact) ===============
      - name: Upload IPA Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HassanyStore_VIP_Edition
          path: build-output/HassanyStore_VIP.ipa
          retention-days: 7


