          @MainActor
          public final class ActivationManager: ObservableObject {
              public static let shared = MainActor.assumeIsolated { ActivationManager() }

              public static let activationNameLink = "https://t.me/hassany_store"
              public static let codesSiteBase = "https://project--9e6278b0-f5b2-4b14-9b4f-75f855f319c6.lovable.app"

              @Published public private(set) var isActive: Bool = false
              @Published public private(set) var code: String = ""
              @Published public var isWorking: Bool = false
              @Published public var lastError: String = ""

              private let kCode = "hassany_code_v1"

              private init() {
                  code = UserDefaults.standard.string(forKey: kCode) ?? ""
                  refreshLocalState()
              }

              @Published public var udid: String = UserDefaults.standard.string(forKey: "hassany_udid_v1") ?? "" {
                  didSet {
                      let clean = udid.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                      UserDefaults.standard.set(clean, forKey: "hassany_udid_v1")
                  }
              }

              public var deviceID: String {
                  let clean = udid.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                  if !clean.isEmpty { return clean }
                  return UIDevice.current.identifierForVendor?.uuidString ?? UUID().uuidString
              }

              private func refreshLocalState() {
                  isActive = !code.isEmpty
              }

              public func activate(code newCode: String, completion: ((Bool) -> Void)? = nil) {
                  let clean = newCode.trimmingCharacters(in: .whitespacesAndNewlines).uppercased()
                  guard clean.count >= 6 else {
                      lastError = "أدخل كود اشتراك صحيح"
                      completion?(false)
                      return
                  }
                  
                  isWorking = true
                  lastError = ""
                  
                  // محاكاة الاتصال بالسيرفر لتفعيل الكود (يتم ربطه لاحقاً بـ Supabase)
                  DispatchQueue.main.asyncAfter(deadline: .now() + 1.5) {
                      self.code = clean
                      UserDefaults.standard.set(self.code, forKey: self.kCode)
                      self.isActive = true
                      self.isWorking = false
                      HapticManager.shared.success()
                      completion?(true)
                  }
              }
          }

