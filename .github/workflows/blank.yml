              "التالي": "Next",
              "رجوع": "Back",
              "تأكيد": "Confirm",
              "إلغاء": "Cancel",
              "حفظ": "Save",
              "إغلاق": "Close",
              "الإعدادات": "Settings",
              "الحساب": "Account",
