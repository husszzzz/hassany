name: Hassany Store - VIP Edition

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  BUNDLE_ID: "com.hassany.store.vip"
  APP_NAME:  "Hassany Store"

jobs:
  build-store:
    runs-on: macos-latest
    steps:
      - name: 🚀 تهيئة السيرفر
        run: |
          XCODE_PATH=$(ls -d /Applications/Xcode*.app | sort -V | tail -n 1)
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"

      - name: 📂 إعداد المجلدات
        run: |
          mkdir -p build-output/Payload
          mkdir -p Resources

      # =============== 1. إعدادات النظام ===============
      - name: Generate Info.plist
        run: |
          cat > Resources/Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>CFBundleExecutable</key> <string>HassanyStore</string>
              <key>CFBundleIdentifier</key> <string>${{ env.BUNDLE_ID }}</string>
              <key>CFBundleName</key> <string>${{ env.APP_NAME }}</string>
              <key>CFBundleDisplayName</key> <string>${{ env.APP_NAME }}</string>
              <key>CFBundlePackageType</key> <string>APPL</string>
              <key>CFBundleShortVersionString</key> <string>2.0</string>
              <key>CFBundleVersion</key> <string>1</string>
              <key>LSRequiresIPhoneOS</key> <true/>
              <key>MinimumOSVersion</key> <string>15.0</string>
              <key>UIUserInterfaceStyle</key> <string>Dark</string>
              <key>NSAppTransportSecurity</key>
              <dict><key>NSAllowsArbitraryLoads</key><true/></dict>
          </dict>
          </plist>
          EOF

      # =============== 2. الثيم والألوان والتأثيرات ===============
      - name: Generate Theme.swift
        run: |
          cat > Theme.swift << 'EOF'
          import SwiftUI
          import UIKit

          struct Theme {
              static let bg = Color(red: 0.05, green: 0.05, blue: 0.07)
              static let card = Color(red: 0.10, green: 0.10, blue: 0.13)
              static let primary = Color(red: 0.85, green: 0.65, blue: 0.13) // ذهبي ملكي
              static let primaryDk = Color(red: 0.65, green: 0.45, blue: 0.0)
              static let accent = Color(red: 0.0, green: 0.9, blue: 1.0) // أزرق نيون
              static let sub = Color.white.opacity(0.6)
              static let divider = Color.white.opacity(0.1)

              static var goldGradient: LinearGradient {
                  LinearGradient(colors: [primary, primaryDk], startPoint: .topLeading, endPoint: .bottomTrailing)
              }
          }

          struct GlassModifier: ViewModifier {
              var radius: CGFloat = 20
              func body(content: Content) -> some View {
                  content
                      .background(Color.white.opacity(0.05))
                      .cornerRadius(radius)
                      .overlay(RoundedRectangle(cornerRadius: radius).stroke(Theme.divider, lineWidth: 1))
                      .shadow(color: Color.black.opacity(0.3), radius: 10, y: 5)
              }
          }

          extension View {
              func glassCard(radius: CGFloat = 20) -> some View {
                  self.modifier(GlassModifier(radius: radius))
              }
          }

          class Haptic {
              static let shared = Haptic()
              func success() { UINotificationFeedbackGenerator().notificationOccurred(.success) }
              func impact() { UIImpactFeedbackGenerator(style: .medium).impactOccurred() }
          }
          EOF

      # =============== 3. قواعد البيانات للـسورسات ===============
      - name: Generate Models.swift
        run: |
          cat > Models.swift << 'EOF'
          import Foundation

          struct StoreAPIApp: Codable, Identifiable, Hashable {
              let id: Int
              let name: String
              let bundleId: String?
              let version: String?
              let ipaUrl: String?
              let icon: String?
              let description: String?
              let category: String?
              let sizeString: String?

              enum CodingKeys: String, CodingKey {
                  case id, name
                  case bundleId = "bundle_id", bundleIdAlt = "bundleID", bundleIdentifier
                  case version, bundleVersion = "bundle_version"
                  case ipaUrl = "ipa_url", downloadURL, down
                  case icon, iconURL
                  case description, localizedDescription
                  case category
                  case ipaSize = "ipa_size", sizeStr = "size"
              }

              init(from decoder: Decoder) throws {
                  let c = try decoder.container(keyedBy: CodingKeys.self)
                  self.id = (try? c.decode(Int.self, forKey: .id)) ?? UUID().uuidString.hashValue
                  self.name = (try? c.decode(String.self, forKey: .name)) ?? "تطبيق بلس"
                  self.bundleId = (try? c.decode(String.self, forKey: .bundleId)) ?? (try? c.decode(String.self, forKey: .bundleIdAlt)) ?? (try? c.decode(String.self, forKey: .bundleIdentifier))
                  self.version = (try? c.decode(String.self, forKey: .version)) ?? (try? c.decode(String.self, forKey: .bundleVersion))
                  self.ipaUrl = (try? c.decode(String.self, forKey: .ipaUrl)) ?? (try? c.decode(String.self, forKey: .downloadURL)) ?? (try? c.decode(String.self, forKey: .down))
                  self.icon = (try? c.decode(String.self, forKey: .icon)) ?? (try? c.decode(String.self, forKey: .iconURL))
                  self.description = (try? c.decode(String.self, forKey: .description)) ?? (try? c.decode(String.self, forKey: .localizedDescription))
                  self.category = try? c.decode(String.self, forKey: .category)
                  
                  if let strSize = try? c.decode(String.self, forKey: .ipaSize) {
                      self.sizeString = strSize
                  } else if let doubleSize = try? c.decode(Double.self, forKey: .sizeStr) {
                      let formatter = ByteCountFormatter()
                      formatter.allowedUnits = [.useMB, .useGB]; formatter.countStyle = .file
                      self.sizeString = formatter.string(fromByteCount: Int64(doubleSize))
                  } else {
                      self.sizeString = nil
                  }
              }
              var cleanSize: String { return sizeString ?? "مجهول" }
          }
          EOF

      # =============== 4. محرك سحب التطبيقات (السورسات اللي طلبتها) ===============
      - name: Generate StoreFeed.swift
        run: |
          cat > StoreFeed.swift << 'EOF'
          import Foundation
          import SwiftUI

          @MainActor
          final class StoreFeed: ObservableObject {
              @Published var apps: [StoreAPIApp] = []
              @Published var isLoading: Bool = false
              
              // تم إضافة السورسات اللي طلبتها
              let sources = [
                  "https://raw.githubusercontent.com/ikiraplus/ipastore/main/jom.json",
                  "https://repository.apptesters.org/apps.json"
              ]

              init() { Task { await refresh() } }

              func refresh() async {
                  isLoading = true
                  defer { isLoading = false }
                  var allApps: [StoreAPIApp] = []
                  
                  for source in sources {
                      guard let url = URL(string: source) else { continue }
                      do {
                          var req = URLRequest(url: url); req.timeoutInterval = 15
                          let (data, _) = try await URLSession.shared.data(for: req)
                          
                          if let arr = try? JSONDecoder().decode([StoreAPIApp].self, from: data) {
                              allApps.append(contentsOf: arr)
                          } else {
                              struct Wrapper: Codable { let apps: [StoreAPIApp] }
                              if let w = try? JSONDecoder().decode(Wrapper.self, from: data) {
                                  allApps.append(contentsOf: w.apps)
                              }
                          }
                      } catch {
                          print("فشل السحب من: \(source)")
                      }
                  }
                  
                  // تصفية التطبيقات المكررة
                  var unique = [StoreAPIApp]()
                  var seen = Set<String>()
                  for app in allApps {
                      let key = app.bundleId ?? app.name
                      if !seen.contains(key) { seen.insert(key); unique.append(app) }
                  }
                  self.apps = unique.sorted { $0.name < $1.name }
              }
          }
          EOF

      # =============== 5. محرك الصور ===============
      - name: Generate ImageCache.swift
        run: |
          cat > ImageCache.swift << 'EOF'
          import SwiftUI

          @MainActor
          final class ImageCache: ObservableObject {
              static let shared = ImageCache()
              @Published var cache: [String: UIImage] = [:]
              private let mem = NSCache<NSString, UIImage>()
              
              func image(for urlStr: String?) -> UIImage? {
                  guard let s = urlStr, let url = URL(string: s) else { return nil }
                  if let img = mem.object(forKey: s as NSString) { return img }
                  Task {
                      if let (data, _) = try? await URLSession.shared.data(from: url), let img = UIImage(data: data) {
                          self.mem.setObject(img, forKey: s as NSString)
                          self.cache[s] = img
                      }
                  }
                  return nil
              }
          }

          struct RemoteIcon: View {
              let url: String?
              @ObservedObject private var cache = ImageCache.shared
              var body: some View {
                  if let img = cache.image(for: url) {
                      Image(uiImage: img).resizable().aspectRatio(contentMode: .fill)
                  } else {
                      Color.gray.opacity(0.3).overlay(Image(systemName: "app.fill").foregroundColor(.white.opacity(0.5)))
                  }
              }
          }
          EOF

      # =============== 6. شاشة التفعيل الخاصة (VIP) ===============
      - name: Generate Activation.swift
        run: |
          cat > Activation.swift << 'EOF'
          import SwiftUI

          class ActivationManager: ObservableObject {
              static let shared = ActivationManager()
              @Published var isActivated: Bool = UserDefaults.standard.bool(forKey: "hassany_active")
              
              func activate(code: String) {
                  if code.count >= 4 { // يمكنك ربطها بسيرفرك لاحقاً
                      UserDefaults.standard.set(true, forKey: "hassany_active")
                      isActivated = true
                      Haptic.shared.success()
                  }
              }
          }

          struct ActivationView: View {
              @State private var code = ""
              @State private var udid = UIDevice.current.identifierForVendor?.uuidString ?? "غير معروف"
              @ObservedObject var manager = ActivationManager.shared

              var body: some View {
                  ZStack {
                      Theme.bg.ignoresSafeArea()
                      VStack(spacing: 24) {
                          Image(systemName: "crown.fill").font(.system(size: 80)).foregroundStyle(Theme.goldGradient)
                          Text("تفعيل Hassany Store").font(.system(size: 28, weight: .black)).foregroundColor(.white)
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("UDID الجهاز").foregroundColor(Theme.sub).font(.system(size: 14))
                              HStack {
                                  Text(udid).font(.system(size: 12)).foregroundColor(.white).lineLimit(1)
                                  Spacer()
                                  Button("نسخ") { UIPasteboard.general.string = udid }
                                      .foregroundColor(Theme.primary).font(.system(size: 12, weight: .bold))
                              }.padding().glassCard()
                          }
                          
                          VStack(alignment: .leading, spacing: 10) {
                              Text("كود الاشتراك").foregroundColor(Theme.sub).font(.system(size: 14))
                              TextField("أدخل الكود هنا", text: $code)
                                  .foregroundColor(.white).padding().glassCard()
                          }
                          
                          Button(action: { manager.activate(code: code) }) {
                              Text("دخول للمتجر")
                                  .font(.system(size: 18, weight: .bold)).foregroundColor(.black)
                                  .frame(maxWidth: .infinity).frame(height: 55)
                                  .background(Theme.goldGradient).cornerRadius(18)
                          }
                          .padding(.top, 10)
                      }
                      .padding(30)
                  }
              }
          }
          EOF

      # =============== 7. واجهة المتجر الأسطورية ===============
      - name: Generate StoreView.swift
        run: |
          cat > StoreView.swift << 'EOF'
          import SwiftUI

          struct StoreView: View {
              @StateObject private var feed = StoreFeed()
              @State private var searchText = ""

              var body: some View {
                  NavigationView {
                      ZStack {
                          Theme.bg.ignoresSafeArea()
                          
                          ScrollView(showsIndicators: false) {
                              VStack(spacing: 24) {
                                  // هيدر المتجر
                                  HStack {
                                      VStack(alignment: .leading, spacing: 4) {
                                          Text("Hassany Store")
                                              .font(.system(size: 28, weight: .black, design: .rounded))
                                              .foregroundStyle(Theme.goldGradient)
                                          Text("الإصدار الملكي VIP")
                                              .font(.system(size: 13, weight: .bold)).foregroundColor(Theme.sub)
                                      }
                                      Spacer()
                                      Image(systemName: "crown.fill").font(.system(size: 32)).foregroundStyle(Theme.goldGradient)
                                  }
                                  .padding(.horizontal, 22).padding(.top, 10)

                                  // شريط البحث
                                  HStack(spacing: 12) {
                                      Image(systemName: "magnifyingglass").foregroundColor(Theme.sub)
                                      TextField("ابحث في \(feed.apps.count) تطبيق...", text: $searchText).foregroundColor(.white)
                                  }
                                  .padding(16).glassCard().padding(.horizontal, 20)

                                  // قائمة التطبيقات
                                  VStack(spacing: 16) {
                                      HStack {
                                          Text("أحدث تطبيقات البلس").font(.system(size: 18, weight: .bold)).foregroundColor(.white)
                                          Spacer()
                                      }.padding(.horizontal, 22)

                                      if feed.isLoading {
                                          ProgressView().tint(Theme.primary).scaleEffect(1.2).padding(.top, 20)
                                      } else {
                                          let filtered = feed.apps.filter { searchText.isEmpty ? true : $0.name.lowercased().contains(searchText.lowercased()) }
                                          ForEach(filtered) { app in
                                              HStack(spacing: 16) {
                                                  RemoteIcon(url: app.icon)
                                                      .frame(width: 65, height: 65).cornerRadius(16)
                                                  
                                                  VStack(alignment: .leading, spacing: 6) {
                                                      Text(app.name).font(.system(size: 16, weight: .bold)).foregroundColor(.white).lineLimit(1)
                                                      Text(app.category ?? "تطبيقات").font(.system(size: 12, weight: .bold)).foregroundColor(Theme.accent)
                                                      Text(app.cleanSize).font(.system(size: 11, weight: .medium)).foregroundColor(Theme.sub)
                                                  }
                                                  Spacer()
                                                  Button(action: {
                                                      Haptic.shared.impact()
                                                      if let urlStr = app.ipaUrl, let url = URL(string: "itms-services://?action=download-manifest&url=\(urlStr)") {
                                                          UIApplication.shared.open(url)
                                                      }
                                                  }) {
                                                      Text("تثبيت")
                                                          .font(.system(size: 13, weight: .bold)).foregroundColor(.black)
                                                          .padding(.horizontal, 18).padding(.vertical, 8)
                                                          .background(Theme.goldGradient).cornerRadius(20)
                                                  }
                                              }
                                              .padding(14).glassCard(radius: 20).padding(.horizontal, 20)
                                          }
                                      }
                                  }
                              }
                              .padding(.bottom, 30)
                          }
                      }
                      .navigationBarHidden(true)
                  }
              }
          }
          EOF

      # =============== 8. نقطة انطلاق التطبيق (App.swift) ===============
      - name: Generate App.swift
        run: |
          cat > App.swift << 'EOF'
          import SwiftUI

          @main
          struct HassanyStoreApp: App {
              @StateObject var activation = ActivationManager.shared

              var body: some Scene {
                  WindowGroup {
                      if activation.isActivated {
                          StoreView()
                              .preferredColorScheme(.dark)
                      } else {
                          ActivationView()
                              .preferredColorScheme(.dark)
                      }
                  }
              }
          }
          EOF

      # =============== 9. التجميع (Compile) ===============
      - name: 🔨 تجميع التطبيق (Compile)
        run: |
          echo "=== جاري تجميع تطبيق Hassany Store ==="
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          xcrun swiftc \
            Theme.swift \
            Models.swift \
            StoreFeed.swift \
            ImageCache.swift \
            Activation.swift \
            StoreView.swift \
            App.swift \
            -sdk "$SDK" \
            -target arm64-apple-ios15.0 \
            -O -module-name HassanyStore \
            -framework SwiftUI -framework UIKit -framework Foundation \
            -o build-output/HassanyStore

      # =============== 10. الحفظ بصيغة IPA ===============
      - name: 📦 تحزيم التطبيق (IPA)
        run: |
          mkdir -p build-output/Payload/HassanyStore.app
          cp build-output/HassanyStore build-output/Payload/HassanyStore.app/
          cp Resources/Info.plist build-output/Payload/HassanyStore.app/
          cd build-output
          zip -r -q HassanyStore.ipa Payload
          echo "✅ تم إنشاء ملف HassanyStore.ipa بنجاح"

      - name: 📤 رفع ملف الـ IPA
        uses: actions/upload-artifact@v4
        with:
          name: HassanyStore-VIP
          path: build-output/HassanyStore.ipa
          retention-days: 7
